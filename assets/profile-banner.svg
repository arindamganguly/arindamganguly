<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Arindam Ganguly - Software Developer</title>
  <desc id="desc">A dark futuristic developer banner with cyan and violet gradients and terminal-inspired details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101b32"/>
      <stop offset="1" stop-color="#17132d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55c2ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
