<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Arindam Ganguly software engineering profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101a36"/>
      <stop offset="1" stop-color="#21113f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36d9ff"/>
      <stop offset="1" stop-color="#9b72ff"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8bbcff" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1020" cy="80" r="150" fill="#7652ff" opacity=".12"/>
  <circle cx="1090" cy="245" r="130" fill="#24cfff" opacity=".09"/>
  <path d="M0 250 C250 180 350 330 620 230 S980 150 1200 205" fill="none" stroke="url(#line)" stroke-width="2" opacity=".6"/>
  <path d="M760 0 L900 0 L760 300 L620 300Z" fill="#ffffff" opacity=".025"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="78" y="112" fill="#8be9ff" font-size="19" letter-spacing="5">HELLO, WORLD. I'M</text>
    <text x="74" y="177" fill="#f4f7ff" font-size="54" font-weight="700">ARINDAM GANGULY</text>
    <rect x="78" y="203" width="510" height="3" rx="2" fill="url(#line)" filter="url(#glow)"/>
    <text x="80" y="242" fill="#c6d5f5" font-size="21">IT Undergraduate  •  Software Engineering  •  DSA</text>
    <g transform="translate(920 95)" fill="none" stroke="url(#line)" stroke-width="3" opacity=".9">
      <path d="M0 50 L65 0 L130 50 L65 100Z"/>
      <path d="M0 90 L65 40 L130 90 L65 140Z" opacity=".5"/>
      <circle cx="65" cy="70" r="14" fill="#39d9ff" fill-opacity=".18"/>
    </g>
    <text x="920" y="270" fill="#8da8d7" font-size="13" letter-spacing="3">BUILD • LEARN • REPEAT</text>
  </g>
