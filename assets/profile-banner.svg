  <circle cx="1080" cy="270" r="140" fill="#9b70ff" opacity=".18" filter="url(#blur)"/>
  <rect x="54" y="48" width="1092" height="234" rx="18" fill="#08111f" fill-opacity=".38" stroke="#8abfff" stroke-opacity=".22"/>
  <circle cx="88" cy="78" r="6" fill="#ff6b7a"/>
  <circle cx="110" cy="78" r="6" fill="#ffd166"/>
  <circle cx="132" cy="78" r="6" fill="#58d6a5"/>
